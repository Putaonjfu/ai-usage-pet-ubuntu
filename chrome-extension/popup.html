<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>连接桌面浮条</title>
<link rel="stylesheet" href="popup.css">
<body>
  <h1>OpenAI 余额</h1>
  <p>在当前余额页选好组织，将小工具中的连接码粘贴到这里。</p>
  <label for="code">连接码</label>
  <input id="code" type="password" autocomplete="off" placeholder="从浮条“连接 Chrome 余额”复制">
  <label class="confirm"><input id="confirmed" type="checkbox">我确认当前组织与 API Key 对应，并允许定时刷新这个余额标签页。</label>
  <button id="connect">连接并同步</button>
  <div class="row"><button id="sync">立即刷新</button><button id="disconnect">断开</button></div>
  <p id="status" role="status">尚未连接</p>
  <small>只将余额金额传给本机，不读取或导出 Cookie、密码、API Key。关闭标签页、退出浏览器或重启小工具后需重新连接。</small>
  <script src="popup.js"></script>
</body></html>
