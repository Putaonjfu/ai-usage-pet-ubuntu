<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>连接桌面浮条</title>
<link rel="stylesheet" href="popup.css">
<body>
  <h1>OpenAI 余额</h1>
  <p>只需配对一次，浏览器或浮条重启后自动恢复。</p>
  <label for="code">连接码</label>
  <input id="code" type="password" autocomplete="off" placeholder="从浮条“连接 Chrome 余额”复制">
  <label class="confirm"><input id="confirmed" type="checkbox">使用当前组织创建独立的最小化余额窗口，保存配对并自动刷新。</label>
  <button id="connect">连接并同步</button>
  <div class="row"><button id="sync">立即刷新</button><button id="use_current">使用当前页</button></div>
  <button id="open_monitor">打开独立余额窗口</button>
  <button id="disconnect">取消配对</button>
  <p id="status" role="status">尚未连接</p>
  <small>每分钟刷新官网。关普通窗口不会关闭独立余额窗口；余额窗口请保持最小化。菜单“退出”Chrome 会停止全部窗口。需要登录时，点“打开独立余额窗口”。</small>
  <script src="popup.js"></script>
</body></html>
