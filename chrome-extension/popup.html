<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>连接桌面浮条</title>
<link rel="stylesheet" href="popup.css">
<body>
  <h1>OpenAI 余额</h1>
  <p>配对会保留。只刷新已有页面，不会自动开窗。</p>
  <label for="code">连接码</label>
  <input id="code" type="password" autocomplete="off" placeholder="从浮条“连接 Chrome 余额”复制">
  <label class="confirm"><input id="confirmed" type="checkbox">同步当前组织余额，保存配对；仅在 Codex 使用官方 API 时刷新已有页面。</label>
  <button id="connect">连接并同步</button>
  <div class="row"><button id="sync">立即刷新</button><button id="use_current">使用当前页</button></div>
  <button id="open_billing">打开官方余额页</button>
  <button id="disconnect">取消配对</button>
  <p id="status" role="status">尚未连接</p>
  <small>账号登录时暂停 API 网页查询。API 模式下每分钟刷新已打开的余额页；关闭页面或浏览器后暂停，不会重新打开。</small>
  <script src="popup.js"></script>
</body></html>
